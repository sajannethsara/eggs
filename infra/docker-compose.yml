services:
  postgres:
    image: postgres:16-alpine
    container_name: eggs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eggs
      POSTGRES_PASSWORD: eggs
      POSTGRES_DB: eggs
    ports:
      - "5432:5432"
    volumes:
      - eggs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eggs -d eggs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eggs-pgdata:
